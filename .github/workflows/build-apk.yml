name: Build App Creator APK
on:
  push:
    branches: [main]
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [appcreator_build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Claim build
        id: job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUESTED_BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,time
          base=os.environ['SUPABASE_URL'].rstrip('/'); key=os.environ['SUPABASE_SERVICE_ROLE_KEY']; requested=os.environ.get('REQUESTED_BUILD_ID','').strip()
          H={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=representation'}
          def call(url,method='GET',data=None):
            req=urllib.request.Request(url,headers=H,method=method,data=data)
            with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read().decode() or '[]')
          def find():
            if requested:return call(base+'/rest/v1/app_creator_builds?select=id,project_id,status,created_at,app_creator_projects(id,slug,name,target_url,logo_data)&id=eq.'+requested+'&status=in.(queued,building)&limit=1')
            rows=call(base+'/rest/v1/app_creator_builds?select=id,project_id,status,created_at,app_creator_projects(id,slug,name,target_url,logo_data)&status=eq.queued&order=created_at.asc&limit=1')
            if rows:return rows
            return call(base+'/rest/v1/app_creator_builds?select=id,project_id,status,created_at,app_creator_projects(id,slug,name,target_url,logo_data)&status=eq.building&order=created_at.asc&limit=1')
          row=None
          for _ in range(24):
            rows=find()
            if rows: row=rows[0]; break
            time.sleep(5)
          if not row: raise SystemExit('No queued/building build found after 120 seconds')
          p=row['app_creator_projects']
          if row['status']=='queued':
            changed=call(base+'/rest/v1/app_creator_builds?id=eq.'+row['id']+'&status=eq.queued','PATCH',b'{"status":"building"}')
            if not changed: raise SystemExit('Build claim lost race')
          with open(os.environ['GITHUB_OUTPUT'],'a') as o:
            for k,v in [('build_id',row['id']),('project_id',p['id']),('slug',p['slug']),('name',p['name']),('target_url',p['target_url']),('logo_data',p.get('logo_data') or '')]: o.write(f'{k}={v}\n')
          PY
      - name: Generate Android project
        env:
          SLUG: ${{ steps.job.outputs.slug }}
          APP_NAME: ${{ steps.job.outputs.name }}
          TARGET_URL: ${{ steps.job.outputs.target_url }}
          LOGO_DATA: ${{ steps.job.outputs.logo_data }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re,html,base64
          root=pathlib.Path('buildapp'); (root/'app/src/main/java/com/appcreator').mkdir(parents=True,exist_ok=True); (root/'app/src/main/res/values').mkdir(parents=True,exist_ok=True); (root/'app/src/main/res/drawable').mkdir(parents=True,exist_ok=True); (root/'app/src/main/res/mipmap-hdpi').mkdir(parents=True,exist_ok=True)
          (root/'settings.gradle').write_text("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name='BuildApp'\ninclude ':app'\n")
          (root/'build.gradle').write_text("plugins { id 'com.android.application' version '8.6.1' apply false }\n")
          slug=re.sub(r'[^a-z0-9]','',os.environ['SLUG'].lower())[:20] or 'app'; appid='com.appcreator.'+slug
          (root/'app/build.gradle').write_text("plugins { id 'com.android.application' }\nandroid { namespace 'com.appcreator'; compileSdk 35; defaultConfig { applicationId '%s'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }; buildTypes { release { minifyEnabled false } } }\n"%appid)
          name=html.escape(os.environ['APP_NAME'],quote=True); target=os.environ['TARGET_URL'].replace('\\','\\\\').replace('"','\\"')
          logo=os.environ.get('LOGO_DATA','')
          if logo.startswith('data:image/') and ';base64,' in logo:
            meta,payload=logo.split(';base64,',1); ext='png' if 'png' in meta else ('webp' if 'webp' in meta else 'jpg'); (root/'app/src/main/res/drawable/app_logo.'+ext).write_bytes(base64.b64decode(payload))
            icon_attr='@drawable/app_logo'
          else: icon_attr='@android:drawable/ic_menu_gallery'
          (root/'app/src/main/res/values/strings.xml').write_text('<resources><string name="app_name">'+name+'</string></resources>')
          (root/'app/src/main/res/values/styles.xml').write_text('<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#087f5b</item></style></resources>')
          (root/'app/src/main/AndroidManifest.xml').write_text('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="@string/app_name" android:icon="'+icon_attr+'" android:roundIcon="'+icon_attr+'"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          (root/'app/src/main/java/com/appcreator/MainActivity.java').write_text('package com.appcreator; import android.app.*; import android.os.*; import android.graphics.Color; import android.graphics.drawable.ColorDrawable; import android.view.*; import android.widget.*; import android.webkit.*; public class MainActivity extends Activity { public void onCreate(Bundle b){super.onCreate(b); LinearLayout root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); LinearLayout bar=new LinearLayout(this); bar.setGravity(Gravity.CENTER_VERTICAL); bar.setPadding(18,12,18,12); bar.setBackgroundColor(Color.rgb(23,32,51)); ImageView logo=new ImageView(this); logo.setImageResource(com.appcreator.R.drawable.app_logo); logo.setAdjustViewBounds(true); LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(48,48); bar.addView(logo,lp); TextView title=new TextView(this); title.setText(getString(R.string.app_name)); title.setTextColor(Color.WHITE); title.setTextSize(19); title.setTypeface(null,1); title.setPadding(12,0,0,0); bar.addView(title,new LinearLayout.LayoutParams(-1,48)); root.addView(bar); WebView w=new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.getSettings().setDomStorageEnabled(true); w.setWebViewClient(new WebViewClient()); w.loadUrl("'+target+'"); root.addView(w,new LinearLayout.LayoutParams(-1,0,1)); setContentView(root); }}')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create signing key
        working-directory: buildapp
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail; : "${KEYSTORE_PASSWORD:=AppCreatorRelease2026!}"; : "${KEY_PASSWORD:=$KEYSTORE_PASSWORD}"; : "${KEY_ALIAS:=appcreator}"; keytool -genkeypair -v -keystore release-key.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App Creator, OU=Release, O=App Creator, L=India, ST=Bihar, C=IN"
      - name: Build release APK
        working-directory: buildapp
        run: gradle --no-daemon clean assembleRelease
      - name: Align and sign APK
        working-directory: buildapp
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail; : "${KEYSTORE_PASSWORD:=AppCreatorRelease2026!}"; : "${KEY_PASSWORD:=$KEYSTORE_PASSWORD}"; : "${KEY_ALIAS:=appcreator}"; APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1); BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"; "$BT/zipalign" -f -p 4 "$APK" app-release-aligned.apk; "$BT/apksigner" sign --ks release-key.jks --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" --out app-release.apk app-release-aligned.apk
      - name: Validate APK
        working-directory: buildapp
        run: |
          set -euo pipefail; APK=app-release.apk; test -s "$APK"; BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"; unzip -t "$APK" >/dev/null; "$BT/zipalign" -c -v 4 "$APK"; "$BT/apksigner" verify --verbose --print-certs "$APK"; "$BT/aapt2" dump badging "$APK" | tee badging.txt; grep -q '^package: name=' badging.txt; grep -q 'application-label:' badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.job.outputs.build_id }}
          path: buildapp/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.job.outputs.build_id }}
          PROJECT_ID: ${{ steps.job.outputs.project_id }}
          APP_NAME: ${{ steps.job.outputs.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail; TAG="build-${BUILD_ID}"; gh release create "$TAG" buildapp/app-release.apk --repo "$GITHUB_REPOSITORY" --title "$APP_NAME APK" --notes "Signed, zipaligned and validated APK" --latest=false; URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-release.apk"; curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/app_creator_projects?id=eq.$PROJECT_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" --data "{\"apk_url\":\"$URL\",\"apk_path\":\"$TAG/app-release.apk\",\"status\":\"ready\"}"; curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/app_creator_builds?id=eq.$BUILD_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" --data "{\"status\":\"ready\",\"apk_path\":\"$URL\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      - name: Mark failed
        if: failure() && steps.job.outputs.build_id != ''
        env:
          BUILD_ID: ${{ steps.job.outputs.build_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/app_creator_builds?id=eq.$BUILD_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" --data "{\"status\":\"failed\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" || true