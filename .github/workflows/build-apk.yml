name: Build App Creator APK
on:
  repository_dispatch:
    types: [app-build]
  push:
    branches: [main]
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-creator-apk-worker
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runner check
        run: echo "APK queue worker started - immediate queue kick"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android build tools PATH
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"
          echo "ANDROID_BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
      - name: Verify worker configuration
        run: test -s scripts/build-apk.sh && bash -n scripts/build-apk.sh
      - name: Build and publish APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/build-apk.sh
      - name: Verify APK output
        run: test -s app-release.apk
      - name: Verify signed APK and package metadata
        shell: bash
        run: |
          command -v apksigner
          apksigner verify --verbose app-release.apk
          aapt2 dump badging app-release.apk | tee apk-badging.txt
          grep -E "package: name='com\.appcreator\.|application-label:" apk-badging.txt
      - name: Publish workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-apk
          path: app-release.apk
          if-no-files-found: error
      - name: Queue worker heartbeat
        run: echo "Queued worker completed successfully"
      - name: Start next queued build immediately
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          count=$(curl -fsS "$SUPABASE_URL/rest/v1/app_creator_builds?select=id&status=eq.queued&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$count" -gt 0 ]; then
            curl -fsS -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data '{"event_type":"app-build","client_payload":{"source":"queue-drain"}}'
            echo "Next queued APK build dispatched"
          else
            echo "Queue empty"
          fi