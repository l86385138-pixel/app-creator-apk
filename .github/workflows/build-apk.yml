name: Build App Creator APK

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types:
      - appcreator_build

permissions:
  contents: write

concurrency:
  group: app-creator-apk-worker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claim queued build
        id: job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUESTED_BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, time, urllib.request
          base=os.environ['SUPABASE_URL']
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          requested=os.environ.get('REQUESTED_BUILD_ID','').strip()
          headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'}
          if requested:
              url=base+'/rest/v1/app_creator_builds?select=id,project_id,app_creator_projects(id,slug,name,target_url,logo_data)&id=eq.'+requested+'&status=eq.queued&limit=1'
          else:
              url=base+'/rest/v1/app_creator_builds?select=id,project_id,app_creator_projects(id,slug,name,target_url,logo_data)&status=eq.queued&order=created_at.asc&limit=1'
          deadline=time.time()+350*60
          while time.time()<deadline:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as response:
                  rows=json.load(response)
              if rows:
                  row=rows[0]
                  project=row['app_creator_projects']
                  patch_url=base+'/rest/v1/app_creator_builds?id=eq.'+row['id']+'&status=eq.queued'
                  patch=urllib.request.Request(patch_url,data=json.dumps({'status':'building'}).encode(),method='PATCH',headers=headers)
                  with urllib.request.urlopen(patch,timeout=20) as response:
                      changed=json.load(response)
                  if not changed:
                      raise SystemExit('Build was claimed by another worker')
                  values={'build_id':row['id'],'project_id':project['id'],'slug':project['slug'],'name':project['name'],'target_url':project['target_url'],'logo_data':project.get('logo_data') or ''}
                  with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                      for k,v in values.items():
                          out.write(f'{k}={v}\n')
                  print('Claimed build:',row['id'])
                  break
              if requested:
                  raise SystemExit('Requested build is not queued')
              print('No queued build yet; retrying in 10 seconds')
              time.sleep(10)
          else:
              raise SystemExit('Timed out waiting for queued build')
          PY

      - name: Generate Android project
        if: steps.job.outputs.build_id != ''
        env:
          SLUG: ${{ steps.job.outputs.slug }}
          APP_NAME: ${{ steps.job.outputs.name }}
          TARGET_URL: ${{ steps.job.outputs.target_url }}
          LOGO_DATA: ${{ steps.job.outputs.logo_data }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, html, base64, urllib.request
          root=pathlib.Path('buildapp')
          (root/'app/src/main/java/com/appcreator').mkdir(parents=True,exist_ok=True)
          (root/'app/src/main/res/values').mkdir(parents=True,exist_ok=True)
          (root/'app/src/main/res/drawable').mkdir(parents=True,exist_ok=True)
          (root/'settings.gradle').write_text("""pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='BuildApp'
          include ':app'
          """)
          (root/'build.gradle').write_text("plugins { id 'com.android.application' version '8.6.1' apply false }\n")
          slug=re.sub(r'[^a-z0-9]','',os.environ['SLUG'].lower())[:20] or 'app'
          (root/'app/build.gradle').write_text(f"""plugins {{ id 'com.android.application' }}

          android {{
              namespace 'com.appcreator'
              compileSdk 35
              defaultConfig {{
                  applicationId 'com.appcreator.{slug}'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }}
              signingConfigs {{
                  release {{
                      storeFile file('../release-key.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }}
              }}
              buildTypes {{
                  release {{ signingConfig signingConfigs.release; minifyEnabled false }}
              }}
          }}
          """)
          name=html.escape(os.environ['APP_NAME'],quote=True)
          logo=os.environ.get('LOGO_DATA','').strip()
          icon=root/'app/src/main/res/drawable/app_icon.png'
          try:
              if logo.startswith('data:image/') and ',' in logo:
                  icon.write_bytes(base64.b64decode(logo.split(',',1)[1]))
              elif re.match(r'^https?://',logo):
                  urllib.request.urlretrieve(logo,icon)
              if not icon.exists() or icon.stat().st_size < 100:
                  raise ValueError('invalid icon')
          except Exception:
              if icon.exists(): icon.unlink()
          icon_attr=' android:icon="@drawable/app_icon"' if icon.exists() else ''
          (root/'app/src/main/AndroidManifest.xml').write_text('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="'+name+'" android:hardwareAccelerated="true"'+icon_attr+'><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          (root/'app/src/main/res/values/styles.xml').write_text('<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>')
          target=os.environ['TARGET_URL'].replace('\\','\\\\').replace('"','\\"')
          (root/'app/src/main/java/com/appcreator/MainActivity.java').write_text('package com.appcreator; import android.app.*; import android.os.*; import android.webkit.*; public class MainActivity extends Activity { public void onCreate(Bundle b){super.onCreate(b); WebView w=new WebView(this); WebSettings s=w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setMediaPlaybackRequiresUserGesture(false); w.setWebViewClient(new WebViewClient()); w.loadUrl("'+target+'"); setContentView(w);} }')
          PY

      - name: Setup Java
        if: steps.job.outputs.build_id != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create release signing key
        if: steps.job.outputs.build_id != ''
        working-directory: buildapp
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:=AppCreatorRelease2026!}"
          : "${KEY_PASSWORD:=$KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:=appcreator}"
          keytool -genkeypair -v -keystore release-key.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App Creator, OU=Release, O=App Creator, L=India, ST=Bihar, C=IN"

      - name: Build release APK
        if: steps.job.outputs.build_id != ''
        working-directory: buildapp
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:=AppCreatorRelease2026!}"
          : "${KEY_PASSWORD:=$KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:=appcreator}"
          export KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS
          gradle --no-daemon --stacktrace clean assembleRelease

      - name: Validate signed APK
        if: steps.job.outputs.build_id != ''
        run: |
          set -euo pipefail
          APK=$(find buildapp/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 100000
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          unzip -t "$APK" >/dev/null
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | tee badging.txt
          grep -q '^package: name=' badging.txt
          grep -q 'application-label:' badging.txt
          cp "$APK" buildapp/app-release.apk

      - name: Upload verified APK
        if: steps.job.outputs.build_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.job.outputs.build_id }}
          path: buildapp/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK after validation
        if: steps.job.outputs.build_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.job.outputs.build_id }}
          PROJECT_ID: ${{ steps.job.outputs.project_id }}
          APP_NAME: ${{ steps.job.outputs.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          TAG="build-${BUILD_ID}"
          gh release create "$TAG" buildapp/app-release.apk --repo "$GITHUB_REPOSITORY" --title "$APP_NAME APK" --notes "Signed, zipaligned and validated Android release APK" --latest=false
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-release.apk"
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/app_creator_projects?id=eq.$PROJECT_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" --data "{\"apk_url\":\"$APK_URL\",\"apk_path\":\"$TAG/app-release.apk\",\"status\":\"ready\"}"
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/app_creator_builds?id=eq.$BUILD_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" --data "{\"status\":\"ready\",\"apk_path\":\"$APK_URL\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Mark failed
        if: failure() && steps.job.outputs.build_id != ''
        env:
          BUILD_ID: ${{ steps.job.outputs.build_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/app_creator_builds?id=eq.$BUILD_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" --data "{\"status\":\"failed\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" || true