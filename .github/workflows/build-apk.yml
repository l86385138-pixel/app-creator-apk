name: Build App Creator APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Runner check
        run: echo "APK workflow runner started"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Claim queued build
        id: claim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,time
          base=os.environ['SUPABASE_URL'].rstrip('/'); key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          h={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=representation'}
          def call(url,method='GET',data=None):
            req=urllib.request.Request(url,headers=h,method=method,data=data)
            with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read().decode() or '[]')
          row=None
          for _ in range(24):
            rows=call(base+'/rest/v1/app_creator_builds?select=id,project_id,status,created_at,app_creator_projects(id,slug,name,target_url,logo_data)&status=eq.queued&order=created_at.asc&limit=1')
            if rows:
              c=rows[0]
              changed=call(base+'/rest/v1/app_creator_builds?id=eq.'+str(c['id'])+'&status=eq.queued','PATCH',b'{"status":"building"}')
              if changed: row=c; break
            time.sleep(5)
          if not row: raise SystemExit('No queued build found')
          p=row['app_creator_projects']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            for k,v in [('build_id',row['id']),('project_id',p['id']),('slug',p['slug']),('app_name',p['name']),('target_url',p['target_url']),('logo_data',p.get('logo_data') or '')]: f.write(k+'='+str(v).replace('\n',' ')+'\n')
          PY
      - name: Generate isolated Android project
        env:
          SLUG: ${{ steps.claim.outputs.slug }}
          APP_NAME: ${{ steps.claim.outputs.app_name }}
          TARGET_URL: ${{ steps.claim.outputs.target_url }}
          LOGO_DATA: ${{ steps.claim.outputs.logo_data }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,pathlib,base64,html
          root=pathlib.Path('buildapp')
          for d in ['app/src/main/java/com/appcreator','app/src/main/res/values','app/src/main/res/drawable']:(root/d).mkdir(parents=True,exist_ok=True)
          slug=re.sub(r'[^a-z0-9]','',os.environ['SLUG'].lower())[:24] or 'app'; appid='com.appcreator.'+slug
          (root/'settings.gradle').write_text("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name='AppCreatorBuild'\ninclude ':app'\n")
          (root/'build.gradle').write_text("plugins { id 'com.android.application' version '8.6.1' apply false }\n")
          (root/'app/build.gradle').write_text("plugins { id 'com.android.application' }\nandroid { namespace 'com.appcreator'; compileSdk 35; defaultConfig { applicationId '%s'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' } }\n"%appid)
          name=html.escape(os.environ['APP_NAME'],quote=True); target=os.environ['TARGET_URL'].replace('\\','\\\\').replace('"','\\"'); logo=os.environ.get('LOGO_DATA','')
          if logo.startswith('data:image/') and ';base64,' in logo:
            meta,payload=logo.split(';base64,',1); ext='png' if 'png' in meta else ('webp' if 'webp' in meta else 'jpg'); (root/f'app/src/main/res/drawable/app_logo.{ext}').write_bytes(base64.b64decode(payload))
          else: (root/'app/src/main/res/drawable/app_logo.xml').write_text('<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#087F5B" android:pathData="M24,4A20,20 0,1 0,24 44A20,20 0,1 0,24 4M24,10A14,14 0,1 1,24 38A14,14 0,1 1,24 10"/></vector>')
          (root/'app/src/main/res/values/strings.xml').write_text('<resources><string name="app_name">'+name+'</string></resources>')
          (root/'app/src/main/res/values/styles.xml').write_text('<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>')
          (root/'app/src/main/AndroidManifest.xml').write_text('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="@string/app_name" android:icon="@drawable/app_logo" android:roundIcon="@drawable/app_logo"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          java='package com.appcreator; import android.app.*; import android.os.*; import android.graphics.Color; import android.webkit.*; import android.widget.*; import android.view.*; public class MainActivity extends Activity { public void onCreate(Bundle b){super.onCreate(b); LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.VERTICAL); LinearLayout h=new LinearLayout(this);h.setGravity(Gravity.CENTER_VERTICAL);h.setPadding(16,8,16,8);h.setBackgroundColor(Color.rgb(23,32,51)); ImageView i=new ImageView(this);i.setImageResource(R.drawable.app_logo);h.addView(i,new LinearLayout.LayoutParams(48,48));TextView t=new TextView(this);t.setText(R.string.app_name);t.setTextColor(Color.WHITE);t.setTextSize(19);t.setPadding(12,0,0,0);h.addView(t,new LinearLayout.LayoutParams(-1,48));r.addView(h);WebView w=new WebView(this);w.getSettings().setJavaScriptEnabled(true);w.getSettings().setDomStorageEnabled(true);w.setWebViewClient(new WebViewClient());w.loadUrl("'+target+'");r.addView(w,new LinearLayout.LayoutParams(-1,0,1));setContentView(r);}}'
          (root/'app/src/main/java/com/appcreator/MainActivity.java').write_text(java)
          PY
      - name: Build release APK
        working-directory: buildapp
        run: gradle --no-daemon clean assembleRelease
      - name: Sign and validate APK
        id: validate
        working-directory: buildapp
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          EXPECTED_NAME: ${{ steps.claim.outputs.app_name }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:=AppCreatorRelease2026!}"; : "${KEY_PASSWORD:=$KEYSTORE_PASSWORD}"; : "${KEY_ALIAS:=appcreator}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1); BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keytool -genkeypair -keystore release-key.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App Creator,O=App Creator,C=IN" -noprompt
          "$BT/zipalign" -f -p 4 "$APK" app-release-aligned.apk
          "$BT/apksigner" sign --ks release-key.jks --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" --out app-release.apk app-release-aligned.apk
          unzip -t app-release.apk >/dev/null
          "$BT/zipalign" -c -v 4 app-release.apk
          "$BT/apksigner" verify --verbose --print-certs app-release.apk
          "$BT/aapt2" dump badging app-release.apk | tee badging.txt
          grep -q '^package: name=' badging.txt
          grep -Fq "application-label:'$EXPECTED_NAME'" badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.claim.outputs.build_id }}
          path: buildapp/app-release.apk
          if-no-files-found: error
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.claim.outputs.build_id }}
          PROJECT_ID: ${{ steps.claim.outputs.project_id }}
          APP_NAME: ${{ steps.claim.outputs.app_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          TAG="build-${BUILD_ID}"; URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-release.apk"
          gh release create "$TAG" buildapp/app-release.apk --repo "$GITHUB_REPOSITORY" --title "$APP_NAME APK" --notes "Verified signed APK" --latest=false
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/app_creator_projects?id=eq.$PROJECT_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data "{\"apk_url\":\"$URL\",\"status\":\"ready\"}"
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/app_creator_builds?id=eq.$BUILD_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data "{\"status\":\"ready\",\"apk_path\":\"$URL\"}"
      - name: Mark build failed
        if: failure() && steps.claim.outputs.build_id != ''
        env:
          BUILD_ID: ${{ steps.claim.outputs.build_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/app_creator_builds?id=eq.$BUILD_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data "{\"status\":\"failed\"}" || true