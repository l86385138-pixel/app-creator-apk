name: Build App Creator APK
on:
  repository_dispatch:
    types: [app-build]
  push:
    branches: [main]
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-creator-apk-worker
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Runner check
        run: echo "APK queue worker started - draining queued builds immediately"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android build tools PATH
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"
          echo "ANDROID_BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
      - name: Verify worker configuration
        run: test -s scripts/build-apk.sh && bash -n scripts/build-apk.sh
      - name: Drain APK queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            queued=$(curl -fsS "$SUPABASE_URL/rest/v1/app_creator_builds?select=id&status=eq.queued&order=created_at.asc&limit=1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
            if [ "$queued" = "[]" ]; then echo "APK queue empty"; break; fi
            echo "Processing oldest queued build"
            bash scripts/build-apk.sh
          done
      - name: Queue drain complete
        run: echo "QUEUE_DRAIN_COMPLETE"