name: Build App Creator APK
on:
  repository_dispatch:
    types: [app-build]
  push:
    branches: [main]
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: app-creator-apk-worker
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Runner check
        run: echo "APK queue worker started - immediate queue drain"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android build tools PATH
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"
          echo "ANDROID_BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
      - name: Verify worker configuration
        run: test -s scripts/build-apk.sh && bash -n scripts/build-apk.sh
      - name: Drain APK queue
        env:
          WORKER_API_URL: https://rpzmnfvtfikiabowjnzj.supabase.co/functions/v1/apk-worker-v2
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            response=$(bash scripts/build-apk.sh 2>&1) || { echo "$response"; exit 1; }
            echo "$response"
            if echo "$response" | grep -q "No queued build found"; then break; fi
          done
      - name: Queue drain complete
        run: echo "QUEUE_DRAIN_COMPLETE"
