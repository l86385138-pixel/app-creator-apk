name: Build App Creator APK

on:
  repository_dispatch:
    types: [app-build]
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '* * * * *'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start
        run: echo "Fast APK worker started"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-overwrite-existing: false

      - name: Android build tools
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"
          echo "ANDROID_BUILD_TOOLS=$BT" >> "$GITHUB_ENV"

      - name: Validate worker script
        run: test -s scripts/build-apk.sh && bash -n scripts/build-apk.sh

      - name: Process queued APK builds
        env:
          WORKER_API_URL: https://rpzmnfvtfikiabowjnzj.supabase.co/functions/v1/apk-worker-v2
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          echo "Starting APK queue worker..."
          for i in $(seq 1 8); do
            echo "===== worker cycle $i/8 ====="
            bash scripts/build-apk.sh || true
            sleep 2
          done
          echo "APK queue worker completed."

