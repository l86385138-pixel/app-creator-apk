name: Build App Creator APK
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'APP_CREATOR_BUILD')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Find newest queued