name: Build App Creator APK
on:
  repository_dispatch:
    types: [app-build]
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: apk-queue-worker
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Runner check
        run: echo "APK queue worker started"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android build tools PATH
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"
          echo "ANDROID_BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
      - name: Verify worker configuration
        run: test -s scripts/build-apk.sh && bash -n scripts/build-apk.sh
      - name: Run persistent APK queue worker
        env:
          WORKER_API_URL: https://rpzmnfvtfikiabowjnzj.supabase.co/functions/v1/apk-worker-v2
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          echo "Starting persistent APK queue worker. New builds will be picked up within seconds."
          curl -sS -X POST "$WORKER_API_URL" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"action":"recover"}' || true
          echo
          END=$((SECONDS + 3300))
          CYCLE=0
          while [ "$SECONDS" -lt "$END" ]; do
            CYCLE=$((CYCLE + 1))
            echo "========== APK worker cycle $CYCLE =========="
            bash scripts/build-apk.sh || true
            sleep 3
          done
          echo "Persistent APK queue worker window finished."