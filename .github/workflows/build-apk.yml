name: Build App Creator APK

on:
  repository_dispatch:
    types: [app-build]
  push:
    branches: [main]
  schedule:
    # GitHub scheduled workflows are not reliable at 1-minute cadence; this is fallback only.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: apk-queue-worker
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner check
        run: echo "APK queue worker started"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Configure Android build tools PATH
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"
          echo "ANDROID_BUILD_TOOLS=$BT" >> "$GITHUB_ENV"

      - name: Verify worker configuration
        run: test -s scripts/build-apk.sh && bash -n scripts/build-apk.sh

      - name: Process one queued APK build
        env:
          WORKER_API_URL: https://rpzmnfvtfikiabowjnzj.supabase.co/functions/v1/apk-worker-v2
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          echo "Recovering queued APK builds..."
          curl -sS -X POST "$WORKER_API_URL" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"action":"recover"}' || true

          echo "Starting one build worker pass..."
          bash scripts/build-apk.sh
          echo "APK queue worker finished."

      - name: Worker heartbeat
        run: echo "Queue worker completed at $(date -u +%FT%TZ)"