name: Build App Creator APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Start APK builder
        run: |
          echo "APK builder runner started"
          echo "SHA=$GITHUB_SHA"
          echo "REF=$GITHUB_REF"
      - uses: actions/checkout@v4
      - name: Verify Android tooling
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
