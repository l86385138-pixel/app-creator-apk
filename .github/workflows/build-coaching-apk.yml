name: Build Techear Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'coaching-apk/**'
      - '.github/workflows/build-coaching-apk.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  TECHEAR_KEYSTORE_PASSWORD: 'TechearAdminBuild2026!'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coaching-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Generate release signing key
        run: |
          keytool -genkeypair -v             -keystore techear-admin-release.jks             -alias techearadmin             -keyalg RSA             -keysize 2048             -validity 10000             -storepass "${{ env.TECHEAR_KEYSTORE_PASSWORD }}"             -keypass "${{ env.TECHEAR_KEYSTORE_PASSWORD }}"             -dname "CN=Techear Admin, O=Great India Technology, C=IN"

      - name: Build signed release APK
        env:
          TECHEAR_KEYSTORE_PASSWORD: ${{ env.TECHEAR_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK is release and signed
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "${APK}"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "${APK}"
          if grep -R "debuggable[[:space:]]*=[[:space:]]*true" app/build/intermediates/merged_manifest/release/AndroidManifest.xml; then
            echo "Release APK must not be debuggable"
            exit 1
          fi

      - name: Copy final APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/TECHEAR-ADMIN.apk

      - name: Upload TECHEAR ADMIN release APK
        uses: actions/upload-artifact@v4
        with:
          name: TECHEAR-ADMIN-Release-APK
          path: coaching-apk/app/build/outputs/apk/release/TECHEAR-ADMIN.apk
          if-no-files-found: error
          retention-days: 30
