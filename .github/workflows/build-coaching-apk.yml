name: Build Techear Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'coaching-apk/**'
      - '.github/workflows/build-coaching-apk.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coaching-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Techear Admin APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Techear-Admin.apk

      - name: Upload Techear Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Techear-Admin-APK
          path: coaching-apk/app/build/outputs/apk/debug/Techear-Admin.apk
          if-no-files-found: error
          retention-days: 30
