name: Build Techear Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'coaching-apk/**'
      - '.github/workflows/build-coaching-apk.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  KEYSTORE_PASSWORD: 'TechearAdminBuild2026!'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coaching-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Generate release signing key
        run: |
          keytool -genkeypair -v \
            -keystore techear-admin-release.jks \
            -alias techearadmin \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ env.KEYSTORE_PASSWORD }}" \
            -keypass "${{ env.KEYSTORE_PASSWORD }}" \
            -dname "CN=Techear Admin, O=Great India Technology, C=IN"

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign release APK
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="app/build/outputs/apk/release/Techear-Admin.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
            --ks techear-admin-release.jks \
            --ks-key-alias techearadmin \
            --ks-pass "pass:${{ env.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ env.KEYSTORE_PASSWORD }}" \
            --out "${OUT}" "${APK}"

      - name: Verify release APK
        run: |
          test -s app/build/outputs/apk/release/Techear-Admin.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/Techear-Admin.apk

      - name: Upload Techear Admin release APK
        uses: actions/upload-artifact@v4
        with:
          name: Techear-Admin-Release-APK
          path: coaching-apk/app/build/outputs/apk/release/Techear-Admin.apk
          if-no-files-found: error
          retention-days: 30
