<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>App Creator</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 4px 20px #00000008}label{display:block;font-weight:700;font-size:13px;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #d5d9e2;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#087f5b;color:#fff}.secondary{background:#eef2f7;color:#172033}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.preview{min-height:620px;border-radius:18px;border:1px solid #ddd;overflow:hidden;background:#111;display:flex;justify-content:center;align-items:center;padding:18px}.phone{width:min(100%,390px);height:620px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 8px 35px #0006;position:relative}.phead{height:70px;padding:14px 18px;background:#172033;color:#fff;display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800}.phead img{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#fff}.web{position:absolute;inset:70px 0 0}.web iframe{width:100%;height:100%;border:0}.muted{color:#687386;font-size:13px}.result{margin-top:14px;padding:13px;border-radius:10px;background:#f0fdf4;display:none;word-break:break-word}.apk{display:inline-block;margin-top:10px;background:#087f5b;color:#fff;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}.preview{min-height:700px}.phone{height:680px}}</style></head><body><header><div class="logo">🚀 App Creator</div><div class="muted">APK Builder</div></header><main class="wrap"><div class="grid"><section class="card"><h2>Create your app</h2><p class="muted">URL is used as app content; it is not shown as the app name.</p><label>App Name</label><input id="name" placeholder="My App"><label>Website URL</label><input id="url" placeholder="https://example.com"><label>Logo URL (optional)</label><input id="logo" placeholder="https://example.com/logo.png"><div class="actions"><button class="secondary" onclick="preview()">Preview</button><button class="primary" onclick="publish()">Publish & Build APK</button></div><div id="result" class="result"></div></section><section class="card"><h2>Mobile App Preview</h2><div class="preview" id="preview"><div class="phone"><div class="phead">🚀 <span>My App</span></div><div style="padding:28px">Enter a website URL and click Preview.</div></div></div></section></div></main><script>const SUPA='https://rpzmnfvtfikiabowjnzj.supabase.co',KEY='sb_publishable_fmCJZdmON1PaC5ZduHuYBQ_IQbWvxx8';function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function valid(u){return /^https?:\/\//i.test(u)}function preview(){const n=document.getElementById('name').value.trim()||'My App',u=document.getElementById('url').value.trim(),l=document.getElementById('logo').value.trim();if(!valid(u)){alert('Enter a valid URL beginning with https:// or http://');return}const im=l&&valid(l)?'<img src="'+esc(l)+'" onerror="this.style.display=\'none\'">':'🚀';document.getElementById('preview').innerHTML='<div class="phone"><div class="phead">'+im+'<span>'+esc(n)+'</span></div><div class="web"><iframe src="'+esc(u)+'" allow="camera;microphone;geolocation;fullscreen;payment" allowfullscreen></iframe></div></div>'}async function publish(){const n=document.getElementById('name').value.trim()||'My App',u=document.getElementById('url').value.trim(),l=document.getElementById('logo').value.trim(),r=document.getElementById('result');if(!valid(u)){alert('Enter a valid URL beginning with https:// or http://');return}r.style.display='block';r.textContent='Publishing and starting APK build...';try{const x=await fetch(SUPA+'/functions/v1/publish-v6',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({name:n,target_url:u,logo_data:valid(l)?l:null,config:{}})});const d=await x.json();if(!x.ok||!d.ok)throw Error(d.error||'Publish failed');r.innerHTML='<b>App published successfully.</b><br><a class="apk" target="_blank" href="'+esc(d.app_url)+'">Open Published App</a><br><span class="muted">APK build queued. The published app will show Download Android APK when the build finishes.</span>';localStorage.setItem('lastApp',JSON.stringify(d))}catch(e){r.textContent='Error: '+e.message}}</script></body></html>
