<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>App Creator</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.logo{font-size:21px;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:22px 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 4px 20px #00000008}label{display:block;font-weight:700;font-size:13px;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #d5d9e2;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#087f5b;color:white}.secondary{background:#eef2f7;color:#172033}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.preview{height:520px;border-radius:12px;border:1px solid #ddd;overflow:hidden;background:#fafafa}.preview iframe{width:100%;height:100%;border:0}.previewMsg{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#687386}.result{margin-top:14px;padding:13px;border-radius:10px;background:#f0fdf4;display:none;word-break:break-all}.muted{color:#687386;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.preview{height:600px}header{position:static}}</style></head><body><header><div class="logo">🚀 App Creator</div><div class="muted">APK Builder</div></header><main class="wrap"><div class="grid"><section class="card"><h2>Create your app</h2><p class="muted">Enter an app name and website URL, preview it, then publish and build an Android APK.</p><label>App Name</label><input id="name" placeholder="My App"><label>Website URL</label><input id="url" placeholder="https://example.com"><label>Logo URL (optional)</label><input id="logo" placeholder="https://..."><div class="actions"><button class="secondary" onclick="preview()">Preview</button><button class="primary" onclick="publish()">Publish & Build APK</button></div><div id="result" class="result"></div></section><section class="card"><h2>Live Preview</h2><div class="preview" id="preview"><div class="previewMsg">Enter a website URL and click <b>Preview</b>.<br>Some websites block embedding; use <b>Open Preview</b> if that happens.</div></div></section></div></main><script>const SUPA='https://rpzmnfvtfikiabowjnzj.supabase.co';const KEY='sb_publishable_fmCJZdmON1PaC5ZduHuYBQ_IQbWvxx8';function getUrl(){let u=document.getElementById('url').value.trim();if(!/^https?:\/\//i.test(u)){alert('Enter a valid URL beginning with https:// or http://');return null}return u}function preview(){const u=getUrl();if(!u)return;const p=document.getElementById('preview');p.innerHTML='<iframe id="frame" src="'+u.replace(/"/g,'&quot;')+'" allow="fullscreen"></iframe><div style="padding:8px;text-align:center;background:#fff"><a href="'+u.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">Open Preview in New Tab</a></div>'}async function publish(){let name=document.getElementById('name').value.trim()||'My Custom App',url=getUrl(),logo=document.getElementById('logo').value.trim();if(!url)return;let r=document.getElementById('result');r.style.display='block';r.textContent='Publishing and starting APK build...';try{let x=await fetch(SUPA+'/functions/v1/publish-app',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({name,target_url:url,logo_data:logo||null,config:{}})});let d=await x.json();if(!x.ok)throw Error(d.error||'Publish failed');r.innerHTML='App published: <a target="_blank" href="'+d.direct_url+'">Open permanent app link</a><br><br>APK build has been queued.';localStorage.setItem('lastApp',JSON.stringify(d))}catch(e){r.textContent='Error: '+e.message}}</script></body></html>
