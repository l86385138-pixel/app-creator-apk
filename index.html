<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>App Creator — LIVE v14</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid #e5e9ef;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-size:19px;font-weight:900;color:#087f5b}.tag{font-size:12px;font-weight:800;background:#e9f8f2;color:#087f5b;padding:7px 11px;border-radius:99px}.wrap{max-width:1160px;margin:auto;padding:26px 16px}.hero h1{margin:0 0 6px;font-size:32px}.hero p{margin:0 0 20px;color:#697586}.grid{display:grid;grid-template-columns:410px 1fr;gap:20px}.card{background:#fff;border:1px solid #e3e7ed;border-radius:18px;padding:20px;box-shadow:0 7px 25px #1720330b}.card h2{margin:0 0 5px;font-size:20px}.muted{font-size:13px;color:#697586;line-height:1.5}label{display:block;font-size:13px;font-weight:800;margin:16px 0 7px}input{width:100%;height:46px;border:1px solid #d4dae3;border-radius:11px;padding:0 12px;font:inherit;outline:0}.file{height:auto;padding:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:19px}.btn{height:48px;border:0;border-radius:11px;font-weight:900;cursor:pointer}.secondary{background:#edf1f6;color:#172033}.primary{background:#087f5b;color:#fff}.primary:disabled{opacity:.55;cursor:wait}.result{display:none;margin-top:13px;padding:13px;border-radius:11px;background:#effaf5}.error{background:#fff0f2;color:#9b1238}.apk{display:block;text-decoration:none;text-align:center;background:#087f5b;color:#fff;padding:12px;border-radius:10px;margin-top:10px;font-weight:900}.preview{background:#111827;border-radius:18px;padding:15px;min-height:650px;display:flex;justify-content:center}.phone{width:min(100%,390px);height:620px;background:#fff;border-radius:25px;overflow:hidden}.head{height:58px;background:#172033;color:#fff;display:flex;align-items:center;padding:0 16px;font-weight:900}.body{height:562px}.body iframe{width:100%;height:100%;border:0}.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#697586;padding:30px}@media(max-width:820px){.grid{grid-template-columns:1fr}.hero h1{font-size:28px}.preview{min-height:auto;padding:8px}.phone{width:100%;height:calc(100vh - 150px);min-height:560px}.body{height:calc(100% - 58px)}.actions{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">🚀 App Creator</div><div class="tag">LIVE v14</div></header><main class="wrap"><section class="hero"><h1>Create your Android app</h1><p>Website URL डालें, preview देखें और Publish करके APK बनाएं.</p></section><div class="grid"><section class="card"><h2>App Details</h2><div class="muted">नई Publish request सीधे current Supabase APK pipeline में जाएगी.</div><label>App Name</label><input id="name" placeholder="My App"><label>Website URL</label><input id="url" type="url" placeholder="https://example.com"><label>App Logo</label><input id="logo" class="file" type="file" accept="image/png,image/jpeg,image/webp"><div class="actions"><button class="btn secondary" id="preview">Preview</button><button class="btn primary" id="publish">Publish & Build APK</button></div><div id="result" class="result"></div></section><section class="card"><h2>Mobile App Preview</h2><div class="muted" style="margin-bottom:10px">आपकी website app के अंदर दिखाई देगी.</div><div class="preview" id="previewBox"><div class="phone"><div class="head">🚀 <span id="pname">My App</span></div><div class="body"><div class="empty">Website URL डालकर<br>Preview दबाएं.</div></div></div></div></section></div></main><script>const API='https://rpzmnfvtfikiabowjnzj.supabase.co/functions/v1';const PUBLISH='publish-v13';const STATUS='build-status-v3';let buildId=null,timer=null,start=0;const $=x=>document.getElementById(x);const valid=u=>/^https?:\/\//i.test(u);function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(x,e=false){$('result').className='result'+(e?' error':'');$('result').style.display='block';$('result').innerHTML=x}$('name').oninput=()=>{$('pname').textContent=$('name').value.trim()||'My App'};$('preview').onclick=()=>{let u=$('url').value.trim(),n=$('name').value.trim()||'My App';if(!valid(u))return show('❌ Valid Website URL डालें.',true);$('previewBox').innerHTML='<div class="phone"><div class="head">🚀 <span>'+esc(n)+'</span></div><div class="body"><iframe src="'+esc(u)+'" allow="camera;microphone;geolocation;fullscreen;payment" allowfullscreen></iframe></div></div>'};async function call(path,data){let r=await fetch(API+'/'+path+'?t='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','Cache-Control':'no-cache'},body:JSON.stringify(data),cache:'no-store'}),t=await r.text(),d;try{d=JSON.parse(t)}catch{throw Error('Server response invalid')}if(!r.ok||d.ok===false)throw Error(d.error||d.message||'Request failed');return d}function download(u){clearTimeout(timer);$('publish').disabled=false;show('<b>✅ APK तैयार है</b><a class="apk" href="'+esc(u)+'" target="_blank" rel="noopener">⬇️ Download Android APK</a>')}async function poll(){try{let d=await call(STATUS,{build_id:buildId}),u=d.apk_url||d.apk_path||d.project?.apk_url||d.project?.apk_path||d.build?.apk_url||d.build?.apk_path;if(u)return download(u);let s=String(d.status||d.build?.status||'').toLowerCase();if(s==='failed')throw Error(d.error||d.build_log||d.build?.build_log||'APK build failed');show('⏳ <b>APK अभी बन रहा है...</b><div class="muted">Build ID: '+esc(buildId)+'<br>Status automatically refresh हो रहा है — '+Math.floor((Date.now()-start)/1000)+' सेकंड.</div>')}catch(e){$('publish').disabled=false;show('❌ '+esc(e.message||e),true);return}timer=setTimeout(poll,1500)}$('publish').onclick=async()=>{clearTimeout(timer);let n=$('name').value.trim()||'My App',u=$('url').value.trim();if(!valid(u))return show('❌ Valid Website URL डालें.',true);$('publish').disabled=true;show('⏳ Build request भेजा जा रहा है...');try{let f=$('logo').files?.[0],logo=null;if(f){if(f.size>3e6)throw Error('Logo 3 MB से छोटा रखें');logo=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}let d=await call(PUBLISH,{name:n,target_url:u,logo_data:logo,config:{}});buildId=d.build_id;if(!buildId)throw Error('Build ID नहीं मिला');start=Date.now();poll()}catch(e){$('publish').disabled=false;show('❌ '+esc(e.message||e),true)}};</script></body></html>
