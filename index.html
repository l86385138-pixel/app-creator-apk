<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>App Creator</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 18px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.logo{font-size:21px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 4px 20px #00000008}label{display:block;font-weight:700;font-size:13px;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #d5d9e2;border-radius:10px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#087f5b;color:#fff}.secondary{background:#eef2f7}.preview{min-height:700px;border-radius:18px;border:1px solid #ddd;overflow:hidden;background:#111;display:flex;justify-content:center;align-items:center;padding:18px}.phone{width:min(100%,390px);height:680px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 8px 35px #0006;position:relative}.phead{height:70px;padding:14px 18px;background:#172033;color:#fff;display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800}.web{position:absolute;inset:70px 0 0}.web iframe{width:100%;height:100%;border:0}.muted{color:#687386;font-size:13px}.result{margin-top:14px;padding:13px;border-radius:10px;background:#f0fdf4;display:none;line-height:1.55}.apk{display:inline-block;margin-top:10px;background:#087f5b;color:#fff;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:800}.download{display:block;width:100%;text-align:center;font-size:17px;padding:16px}.wait{display:inline-block;margin-top:10px;padding:10px 12px;border-radius:9px;background:#eef2f7}.error{background:#fff1f2;color:#9f1239}@media(max-width:800px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.card{padding:15px}.preview{min-height:calc(100vh - 100px);padding:0}.phone{width:100%;height:calc(100vh - 125px);min-height:650px;border-radius:18px}.phead{height:62px}.web{inset:62px 0 0}}
</style></head><body><header><div class="logo">🚀 App Creator</div><div class="muted">APK Builder</div></header><main class="wrap"><div class="grid"><section class="card"><h2>Create your app</h2><p class="muted">Website URL becomes your Android app.</p><label>App Name</label><input id="name" placeholder="My App"><label>Website URL</label><input id="url" placeholder="https://example.com"><label>Logo URL (optional)</label><input id="logo" placeholder="https://example.com/logo.png"><div class="actions"><button class="secondary" onclick="preview()">Preview</button><button class="primary" onclick="publish()">Publish & Build APK</button></div><div id="result" class="result"></div></section><section class="card"><h2>Mobile App Preview</h2><div class="preview" id="preview"><div class="phone"><div class="phead">🚀 <span>My App</span></div><div style="padding:28px">Enter a website URL and click Preview.</div></div></div></section></div></main><script>const SUPA='https://rpzmnfvtfikiabowjnzj.supabase.co',KEY='sb_publishable_fmCJZdmON1PaC5ZduHuYBQ_IQbWvxx8',STATUS=SUPA+'/functions/v1/build-status-v2',STORE='app_creator_last_build';function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function valid(u){return /^https?:\/\//i.test(u)}function preview(){const n=document.getElementById('name').value.trim()||'My App',u=document.getElementById('url').value.trim();if(!valid(u)){alert('Enter a valid URL beginning with https:// or http://');return}document.getElementById('preview').innerHTML='<div class="phone"><div class="phead">🚀 <span>'+esc(n)+'</span></div><div class="web"><iframe src="'+esc(u)+'" allow="camera;microphone;geolocation;fullscreen;payment" allowfullscreen></iframe></div></div>'}function showReady(r,apk,cached){r.className='result';r.style.display='block';r.innerHTML='<b>✅ APK is ready!</b>'+(cached?'<br><span class="muted">⚡ Ready instantly from the verified APK cache.</span>':'')+'<br><a class="apk download" href="'+esc(apk)+'" target="_blank" rel="noopener">⬇️ Download Android APK</a><p class="muted">Download करके Android में APK खोलें और Install करें.</p>'}async function checkBuild(buildId,r){try{const x=await fetch(STATUS,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({build_id:buildId}),cache:'no-store'});const d=await x.json();if(d.apk_url){showReady(r,d.apk_url,false);return true}if(d.status==='failed'){r.className='result error';r.style.display='block';r.textContent='❌ APK build failed.';return true}}catch(e){}return false}async function poll(buildId,r){while(true){if(await checkBuild(buildId,r))return;await new Promise(a=>setTimeout(a,5000))}}async function publish(){const n=document.getElementById('name').value.trim()||'My App',u=document.getElementById('url').value.trim(),l=document.getElementById('logo').value.trim(),r=document.getElementById('result');if(!valid(u)){alert('Enter a valid URL beginning with https:// or http://');return}r.className='result';r.style.display='block';r.innerHTML='⏳ Publishing app...';try{const x=await fetch(SUPA+'/functions/v1/publish-v6',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({name:n,target_url:u,logo_data:valid(l)?l:null,config:{}})});const d=await x.json();if(!x.ok||!d.ok)throw Error(d.error||'Publish failed');const id=d.build_id||d.build?.build_id;localStorage.setItem(STORE,JSON.stringify({build_id:id,app_url:d.app_url,name:n,apk_url:d.apk_url||null}));if(d.apk_url){showReady(r,d.apk_url,true);return}r.innerHTML='<b>✅ App published.</b><br><a class="apk" target="_blank" href="'+esc(d.app_url)+'">Open Published App</a><div class="wait">⏳ APK is building...</div>';if(!id){r.innerHTML+='<br><span class="muted">Build request accepted. Refresh later to check.</span>';return}if(!(await checkBuild(id,r)))poll(id,r)}catch(e){r.className='result error';r.style.display='block';r.textContent='Error: '+e.message}}async function restore(){try{const z=JSON.parse(localStorage.getItem(STORE)||'null');if(!z?.build_id)return;const r=document.getElementById('result');r.className='result';r.style.display='block';if(z.apk_url){showReady(r,z.apk_url,true);return}r.innerHTML='<b>Checking latest APK...</b>';if(!(await checkBuild(z.build_id,r)))poll(z.build_id,r)}catch(e){}}restore();</script></body></html>
