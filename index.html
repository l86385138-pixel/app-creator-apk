<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>App Creator</title><style>body{margin:0;font-family:system-ui;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}label{display:block;font-weight:700;font-size:13px;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #d5d9e2;border-radius:10px;font:inherit;box-sizing:border-box}.actions{display:flex;gap:10px;margin-top:18px}.button{border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#087f5b;color:#fff}.secondary{background:#eef2f7}.apkDirect{display:block;width:100%;margin-top:10px;text-align:center;text-decoration:none;background:#172033;color:#fff;border-radius:10px;padding:15px 18px;font-weight:800;box-sizing:border-box}.result{margin-top:14px;padding:13px;border-radius:10px;background:#f0fdf4;display:none;line-height:1.55}.error{background:#fff1f2;color:#9f1239}.apk{display:block;margin-top:10px;background:#087f5b;color:#fff;padding:14px;border-radius:10px;text-decoration:none;font-weight:800;text-align:center}.muted{color:#687386;font-size:13px}.logoPick{display:flex;align-items:center;gap:10px;margin-top:8px}.logoPick img{width:54px;height:54px;object-fit:contain;border:1px solid #ddd;border-radius:10px;background:#fff}.preview{min-height:650px;background:#111;border-radius:18px;display:flex;justify-content:center;padding:18px}.phone{width:min(100%,390px);height:650px;background:#fff;border-radius:25px;overflow:hidden}.phead{height:62px;padding:14px 18px;background:#172033;color:#fff;font-size:19px;font-weight:800;box-sizing:border-box}.web{height:calc(100% - 62px)}iframe{width:100%;height:100%;border:0}@media(max-width:800px){.grid{grid-template-columns:1fr}.preview{padding:0}.phone{width:100%;height:calc(100vh - 110px);min-height:650px;border-radius:18px}}</style></head><body><header><b>🚀 App Creator</b><span class="muted">APK Builder</span></header><main class="wrap"><div class="grid"><section class="card"><h2>Create your app</h2><p class="muted">Website URL becomes your Android app.</p><label>App Name</label><input id="name" placeholder="My App"><label>Website URL</label><input id="url" placeholder="https://example.com"><label>App Logo</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><div id="logoPick" class="logoPick" style="display:none"><img id="logoPreview"><span class="muted">Logo selected</span></div><label>Logo URL (optional)</label><input id="logo" placeholder="https://example.com/logo.png"><div class="actions"><button class="button secondary" onclick="preview()">Preview</button><button class="button primary" onclick="publish()">Publish</button></div><a class="apkDirect" href="#" onclick="downloadAndroid(event)">⬇️ Download Android APK</a><div id="result" class="result"></div></section><section class="card"><h2>Mobile App Preview</h2><div class="preview" id="preview"><div class="phone"><div class="phead">🚀 <span id="previewName">My App</span></div><div style="padding:28px">Enter a website URL and click Preview.</div></div></div></section></div></main><script>const SUPA='https://rpzmnfvtfikiabowjnzj.supabase.co',KEY='sb_publishable_fmCJZdmON1PaC5ZduHuYBQ_IQbWvxx8',PUBLISH=SUPA+'/functions/v1/publish-v11',STATUS=SUPA+'/functions/v1/build-status-v3';let logoData='';const fileInput=document.getElementById('logoFile');fileInput.addEventListener('change',()=>{const f=fileInput.files&&fileInput.files[0];if(!f)return;if(f.size>3*1024*1024){alert('Logo 3 MB से छोटा रखें');fileInput.value='';return}if(!['image/png','image/jpeg','image/webp'].includes(f.type)){alert('PNG, JPG या WEBP logo चुनें');fileInput.value='';return}const rd=new FileReader();rd.onload=()=>{logoData=String(rd.result||'');document.getElementById('logoPreview').src=logoData;document.getElementById('logoPick').style.display='flex'};rd.onerror=()=>alert('Logo पढ़ा नहीं जा सका');rd.readAsDataURL(f)});const cleanError=v=>{try{if(v==null)return'Unknown error';if(typeof v==='string')return v;if(v.message)return String(v.message);if(v.error)return cleanError(v.error);return JSON.stringify(v)}catch{return String(v)}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const valid=u=>/^https?:\/\//i.test(u);function preview(){const n=document.getElementById('name').value.trim()||'My App',u=document.getElementById('url').value.trim();document.getElementById('previewName').textContent=n;if(!valid(u)){alert('Enter a valid URL beginning with https:// or http://');return}document.getElementById('preview').innerHTML='<div class="phone"><div class="phead">🚀 <span>'+esc(n)+'</span></div><div class="web"><iframe src="'+esc(u)+'" allow="camera;microphone;geolocation;fullscreen;payment" allowfullscreen></iframe></div></div>'}function ready(r,url,auto){r.className='result';r.style.display='block';r.innerHTML='<b>✅ Android APK तैयार है</b><a id="apkLink" class="apk" href="'+esc(url)+'" download>⬇️ Download Android APK</a><p class="muted">यह इसी App Name/Logo वाला APK है.</p>';if(auto){const a=document.getElementById('apkLink');a.click()}}async function status(id,r,auto){try{const x=await fetch(STATUS+'?t='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({build_id:id}),cache:'no-store'});let d;try{d=await x.json()}catch{throw Error('Status server returned invalid response')}if(!x.ok||d.ok===false){r.className='result error';r.style.display='block';r.textContent='❌ '+cleanError(d.error||d.message||d);return true}if(d.apk_url){ready(r,d.apk_url,auto);return true}if(d.status==='failed'){r.className='result error';r.style.display='block';r.textContent='❌ APK build failed: '+cleanError(d.error||d.message);return true}}catch(e){r.className='result error';r.style.display='block';r.textContent='❌ '+cleanError(e);return true}return false}async function poll(id,r,auto){for(let i=0;i<900;i++){if(await status(id,r,auto))return;await new Promise(a=>setTimeout(a,1000))}r.className='result';r.style.display='block';r.innerHTML='<b>⏳ APK अभी बन रहा है.</b><br><span class="muted">Build पूरा होते ही Download button आएगा.</span>'}async function queue(){const n=document.getElementById('name').value.trim()||'My App',u=document.getElementById('url').value.trim(),l=document.getElementById('logo').value.trim();if(!valid(u))throw Error('Enter a valid URL beginning with https:// or http://');const x=await fetch(PUBLISH+'?t='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({name:n,target_url:u,logo_data:logoData||(valid(l)?l:null),config:{}}),cache:'no-store'});let d;try{d=await x.json()}catch{throw Error('Server returned an invalid response')}if(!x.ok||!d.ok)throw Error(cleanError(d.error||d.details||d.message||d));return d}async function publish(){const r=document.getElementById('result');r.className='result';r.style.display='block';r.textContent='⏳ App queue में भेजा जा रहा है...';try{const d=await queue();r.innerHTML='<b>✅ App queued</b><br><a class="apk" target="_blank" href="'+esc(d.app_url)+'">Open Published App</a><p class="muted">⏳ APK बन रहा है...</p>';poll(d.build_id,r,false)}catch(e){r.className='result error';r.style.display='block';r.textContent='❌ '+cleanError(e)}}async function downloadAndroid(ev){ev.preventDefault();const r=document.getElementById('result');r.className='result';r.style.display='block';r.textContent='⏳ Android APK बनाया जा रहा है...';try{const d=await queue();poll(d.build_id,r,true)}catch(e){r.className='result error';r.style.display='block';r.textContent='❌ '+cleanError(e)}}</script></body></html>
