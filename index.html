<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>App Creator</title><style>body{margin:0;font-family:system-ui;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}label{display:block;font-weight:700;font-size:13px;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #d5d9e2;border-radius:10px;font:inherit;box-sizing:border-box}.actions{display:flex;gap:10px;margin-top:18px}.button{border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#087f5b;color:#fff}.secondary{background:#eef2f7}.apk{display:block;margin-top:10px;background:#087f5b;color:#fff;padding:14px;border-radius:10px;text-decoration:none;font-weight:800;text-align:center}.result{margin-top:14px;padding:13px;border-radius:10px;background:#f0fdf4;display:none;line-height:1.55}.error{background:#fff1f2;color:#9f1239}.muted{color:#687386;font-size:13px}.logoPick{display:flex;align-items:center;gap:10px;margin-top:8px}.logoPick img{width:54px;height:54px;object-fit:contain;border:1px solid #ddd;border-radius:10px;background:#fff}.preview{min-height:650px;background:#111;border-radius:18px;display:flex;justify-content:center;padding:18px}.phone{width:min(100%,390px);height:650px;background:#fff;border-radius:25px;overflow:hidden}.phead{height:62px;padding:14px 18px;background:#172033;color:#fff;font-size:19px;font-weight:800;box-sizing:border-box}.web{height:calc(100% - 62px)}iframe{width:100%;height:100%;border:0}@media(max-width:800px){.grid{grid-template-columns:1fr}.preview{padding:0}.phone{width:100%;height:calc(100vh - 110px);min-height:650px;border-radius:18px}}</style></head><body><header style="background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;display:flex;justify-content:space-between"><b>🚀 App Creator</b><span class="muted">APK Builder</span></header><main class="wrap"><div class="grid"><section class="card"><h2>Create your app</h2><p class="muted">Website URL becomes your Android app.</p><label>App Name</label><input id="name" placeholder="My App"><label>Website URL</label><input id="url" placeholder="https://example.com"><label>App Logo</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><div id="logoPick" class="logoPick" style="display:none"><img id="logoPreview"><span class="muted">Logo selected</span></div><label>Logo URL (optional)</label><input id="logo" placeholder="https://example.com/logo.png"><div class="actions"><button class="button secondary" onclick="preview()">Preview</button><button class="button primary" onclick="publish()">Publish</button></div><div id="result" class="result"></div></section><section class="card"><h2>Mobile App Preview</h2><div class="preview" id="preview"><div class="phone"><div class="phead">🚀 <span id="previewName">My App</span></div><div style="padding:28px">Enter a website URL and click Preview.</div></div></div></section></div></main><script>const SUPA='https://rpzmnfvtfikiabowjnzj.supabase.co',PUBLISH=SUPA+'/functions/v1/publish-v12',STATUS=SUPA+'/functions/v1/build-status-v3';let logoData='',pollTimer=null,pollStarted=0;const fileInput=document.getElementById('logoFile');fileInput.addEventListener('change',()=>{const f=fileInput.files&&fileInput.files[0];if(!f)return;if(f.size>3*1024*1024){alert('Logo 3 MB से छोटा रखें');fileInput.value='';return}if(!['image/png','image/jpeg','image/webp'].includes(f.type)){alert('PNG, JPG या WEBP logo चुनें');fileInput.value='';return}const rd=new FileReader();rd.onload=()=>{logoData=String(rd.result||'');document.getElementById('logoPreview').src=logoData;document.getElementById('logoPick').style.display='flex'};rd.readAsDataURL(f)});const clean=v=>{try{if(v==null)return'Unknown error';if(typeof v==='string')return v;if(v.message)return String(v.message);if(v.error)return clean(v.error);return JSON.stringify(v)}catch{return String(v)}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const valid=u=>/^https?:\/\//i.test(u);function preview(){const n=document.getElementById('name').value.trim()||'My App',u=document.getElementById('url').value.trim();document.getElementById('previewName').textContent=n;if(!valid(u)){alert('Enter a valid URL');return}document.getElementById('preview').innerHTML='<div class="phone"><div class="phead">🚀 <span>'+esc(n)+'</span></div><div class="web"><iframe src="'+esc(u)+'" allow="camera;microphone;geolocation;fullscreen;payment" allowfullscreen></iframe></div></div>'}function showReady(url){if(pollTimer)clearTimeout(pollTimer);const r=document.getElementById('result');r.className='result';r.style.display='block';r.innerHTML='<b>✅ Android APK तैयार है</b><a id="apkLink" class="apk" href="'+esc(url)+'" target="_blank" rel="noopener">⬇️ Download Android APK</a><p class="muted">APK successfully built and verified.</p>'}async function api(url,body){let x;try{x=await fetch(url+'?t='+Date.now(),{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8','Accept':'application/json'},body:JSON.stringify(body),cache:'no-store'})}catch(e){throw Error('Server connection failed. Please try again in a moment.')}let raw=await x.text();let d;try{d=JSON.parse(raw)}catch{throw Error('Server returned an invalid response')}if(!x.ok||d.ok===false)throw Error(clean(d.error||d.details||d.message||d));return d}async function checkStatus(id){try{const d=await api(STATUS,{build_id:String(id)});const url=d.apk_url||d.apk_path||d.project?.apk_url||d.project?.apk_path||d.build?.apk_url||d.build?.apk_path;if(url){showReady(url);return true}const status=String(d.status||d.build?.status||'').toLowerCase();if(status==='failed')throw Error(clean(d.error||d.message||d.build_log||d.build?.build_log||'APK build failed'));return false}catch(e){const r=document.getElementById('result');r.className='result error';r.style.display='block';r.innerHTML='❌ '+esc(clean(e))+'<br><button class="button secondary" style="margin-top:8px" onclick="location.reload()">Retry</button>';if(pollTimer)clearTimeout(pollTimer);return true}}async function poll(id){if(pollTimer)clearTimeout(pollTimer);pollStarted=Date.now();const r=document.getElementById('result');r.className='result';r.style.display='block';const tick=async()=>{if(await checkStatus(id))return;const seconds=Math.floor((Date.now()-pollStarted)/1000);r.innerHTML='<b>⏳ APK अभी बन रहा है...</b><br><span class="muted">Build queue में है. Status automatically refresh हो रहा है — '+seconds+' सेकंड.</span>';pollTimer=setTimeout(tick,1000)};await tick()}async function publish(){if(pollTimer)clearTimeout(pollTimer);const r=document.getElementById('result');r.className='result';r.style.display='block';r.textContent='⏳ App queue में भेजा जा रहा है...';try{const n=document.getElementById('name').value.trim()||'My App',u=document.getElementById('url').value.trim(),l=document.getElementById('logo').value.trim();if(!valid(u))throw Error('Enter a valid URL');const d=await api(PUBLISH,{name:n,target_url:u,logo_data:logoData||(valid(l)?l:null),config:{}});if(d.project?.apk_url){showReady(d.project.apk_url);return}if(d.apk_url){showReady(d.apk_url);return}if(!d.build_id)throw Error('Build ID नहीं मिला');poll(d.build_id)}catch(e){r.className='result error';r.style.display='block';r.innerHTML='❌ '+esc(clean(e))+'<br><button class="button secondary" style="margin-top:8px" onclick="publish()">Retry Publish</button>'}}</script></body></html><!-- PUBLISH-V12 -->
