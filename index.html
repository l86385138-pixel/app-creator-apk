<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>App Creator</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 4px 20px #00000008}label{display:block;font-weight:700;font-size:13px;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #d5d9e2;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#087f5b;color:white}.secondary{background:#eef2f7;color:#172033}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.preview{min-height:620px;border-radius:18px;border:1px solid #ddd;overflow:hidden;background:#111;display:flex;justify-content:center;align-items:center;padding:18px}.phone{width:min(100%,390px);height:620px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 8px 35px #0006;position:relative}.phead{height:70px;padding:14px 18px;background:#172033;color:#fff;display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800}.phead img{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#fff}.web{position:absolute;inset:70px 0 0;background:#fff}.web iframe{width:100%;height:100%;border:0}.fallback{padding:28px 18px;font-family:system-ui}.fallback h2{margin:0 0 8px}.fallback a{display:inline-block;padding:11px 16px;background:#087f5b;color:#fff;border-radius:9px;text-decoration:none;font-weight:700}.muted{color:#687386;font-size:13px}.result{margin-top:14px;padding:13px;border-radius:10px;background:#f0fdf4;display:none;word-break:break-word}.apk{display:inline-block;margin-top:10px;background:#087f5b;color:#fff;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}.preview{min-height:700px}.phone{height:680px}}
</style></head><body><header><div class="logo">🚀 App Creator</div><div class="muted">APK Builder</div></header><main class="wrap"><div class="grid"><section class="card"><h2>Create your app</h2><p class="muted">Enter the app name, website URL and optional logo. The URL/domain is not shown inside the app header.</p><label>App Name</label><input id="name" placeholder="My App"><label>Website URL</label><input id="url" placeholder="https://example.com"><label>Logo URL (optional)</label><input id="logo" placeholder="https://example.com/logo.png"><div class="actions"><button class="secondary" onclick="preview()">Preview</button><button class="primary" onclick="publish()">Publish & Build APK</button></div><div id="result" class="result"></div></section><section class="card"><h2>Mobile App Preview</h2><div class="preview" id="preview"><div class="phone"><div class="phead">🚀 <span>My App</span></div><div class="fallback"><h2>Your app preview</h2><p>Enter a website URL and click Preview.</p></div></div></div></section></div></main><script>const SUPA='https://rpzmnfvtfikiabowjnzj.supabase.co';const KEY='sb_publishable_fmCJZdmON1PaC5ZduHuYBQ_IQbWvxx8';function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function preview(){const name=document.getElementById('name').value.trim()||'My App',url=document.getElementById('url').value.trim()||'https://example.com',logo=document.getElementById('logo').value.trim();if(!/^https?:\/\//i.test(url)){alert('Enter a valid URL beginning with https:// or http://');return}document.getElementById('preview').innerHTML='<div class="phone"><div class="phead">'+(logo?'<img src="'+esc(logo)+'">':'🚀')+'<span>'+esc(name)+'</span></div><div class="web"><iframe src="'+esc(url)+'" allow="camera;microphone;geolocation;fullscreen;payment" allowfullscreen></iframe></div></div>'}async function publish(){const name=document.getElementById('name').value.trim()||'My Custom App',url=document.getElementById('url').value.trim(),logo=document.getElementById('logo').value.trim();if(!/^https?:\/\//i.test(url)){alert('Enter a valid URL beginning with https:// or http://');return}const r=document.getElementById('result');r.style.display='block';r.textContent='Publishing and starting APK build...';try{const x=await fetch(SUPA+'/functions/v1/publish-app-v2',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({name,target_url:url,logo_data:logo||null,config:{}})});const d=await x.json();if(!x.ok)throw Error(d.error||'Publish failed');const build=d.build||{};r.innerHTML='<b>App published successfully.</b><br><small>APK build started. The APK download button will appear after GitHub Actions finishes the build.</small><br><a class="apk" target="_blank" href="'+esc(d.direct_url)+'">Open Published App</a>';localStorage.setItem('lastApp',JSON.stringify(d))}catch(e){r.textContent='Error: '+e.message}}</script></body></html>
